# ============================================================
# SeSAC Admin Page — Oracle DB 웹 관리 콘솔 (GitHub 기준)
# 부트캠프 VM 전용 설정은 docker-compose.override.yml 참조
# ============================================================
# 실행: docker compose up -d --build
#   → override 파일이 자동으로 병합됨 (OCI 마운트 등)
#   → http://127.0.0.1:8501  (ssh -L 8501:localhost:8501 로 터널링)
# ============================================================

services:
  admin-page:
    build: .
    container_name: sesac-admin-page
    ports:
      - "127.0.0.1:8501:8000"
    environment:
      - DB_USER=speechapp_admin
      - DB_HOST=sesac-oracle-db
      - DB_PORT=1521
      - DB_SERVICE=${DB_SERVICE:-XEPDB1}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_PAGE_PASSWORD=${ADMIN_PAGE_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    networks:
      - sesac_db
    restart: unless-stopped

networks:
  sesac_db:
    external: true
    name: sesac_speechapp_container_db_default
