# ============================================================
# SeSAC Admin Page — Oracle DB 웹 관리 콘솔
# ============================================================
# 구성:
#   app/          FastAPI 애플리케이션
#   docker-compose.yml  배포용 (VM에서 사용)
#   Dockerfile    이미지 빌드
#
# 실행 (VM):
#   docker compose up -d --build
#   → http://127.0.0.1:8501  (ssh -L 8501:localhost:8501 로 터널링)
#
# 필수 환경변수 (.env 파일, 절대 커밋 금지):
#   ADMIN_PAGE_PASSWORD   웹 로그인 비밀번호
#   DB_PASSWORD           speechapp_admin 의 Oracle 비밀번호
#   SESSION_SECRET        세션 서명용 랜덤 문자열 (openssl rand -hex 32)
# ============================================================

services:
  admin-page:
    build: .
    container_name: sesac-admin-page
    ports:
      - "127.0.0.1:8501:8000"
    environment:
      - DB_USER=speechapp_admin
      - DB_HOST=sesac-oracle-db
      - DB_PORT=1521
      - DB_SERVICE=XEPDB1
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_PAGE_PASSWORD=${ADMIN_PAGE_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    networks:
      - sesac_db
    restart: unless-stopped

networks:
  sesac_db:
    external: true
    name: sesac_speechapp_container_db_default